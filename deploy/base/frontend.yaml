apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibms-frontend
  template:
    metadata:
      labels:
        app: aibms-frontend
    spec:
      containers:
        - name: frontend
          image: aibms-frontend
          # 종료 신호 전에 10초 기다린다 (Service·Ingress 목록에서 빠질 시간). nginx 는 SIGTERM(빠른 종료) 대신
          # 이 대기 동안 남은 요청을 마친다. 기본 유예 30초 안에 들어간다
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          ports:
            - containerPort: 8080
          # 컨테이너 기동 시 config.json 생성 (docker/40-runtime-config.sh)
          envFrom:
            - configMapRef:
                name: aibms-frontend-config
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aibms-frontend
  annotations:
    # 이 어노테이션은 AWS Load Balancer Controller 를 쓸 때만 적용된다.
    # 다른 Ingress 컨트롤러를 쓰면, 그 컨트롤러의 헬스체크 설정 방식으로 바꿔야 한다.
    alb.ingress.kubernetes.io/healthcheck-path: /index.html
spec:
  selector:
    app: aibms-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aibms-frontend-config
data:
  API_BASE_URL: ""
  APP_ENV: dev
  LOGIN_METHODS: '["TEMP"]'
  TEMP_LOGIN_PASSWORD_REQUIRED: "true"
