# 같은 도메인, 경로로 분리: / → frontend (이 파일), /api·/auth·/.well-known → backend (aibms-backend 레포)
# 컨트롤러 종류(ALB 등)·IP 제한·도메인·인증서는 클러스터 환경에 맞춰 설정
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aibms-frontend
  annotations: {}
spec:
  # ingressClassName: TODO
  # 화면과 API 는 같은 도메인을 쓰고 Ingress 는 레포마다 따로 있다 (aibms-backend · aibms-frontend).
  # AWS Load Balancer Controller 를 쓰면 두 Ingress 에 같은 alb.ingress.kubernetes.io/group.name 을 넣어야 로드밸런서가 하나로 합쳐진다
  # (경로 순서는 group.order — 백엔드를 먼저). ingress-nginx 는 같은 host 를 자동으로 합친다
  rules:
    - host: aibms.example.invalid   # TODO 도메인 발급 대기 (overlays 에서 교체)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aibms-frontend
                port:
                  number: 80
