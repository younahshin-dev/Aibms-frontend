# prod: v* 태그 이미지를 PR + 승인으로 갱신. 이 폴더는 CODEOWNERS 로 운영 담당만 고치게 막는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aibms-prod

resources:
  - ../../base

images:
  - name: aibms-frontend
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/aibms-frontend
    newTag: TODO

patches:
  - target:
      kind: ConfigMap
      name: aibms-frontend-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
      - op: replace
        path: /data/LOGIN_METHODS
        value: '["OKTA"]'    # 아이디·비밀번호 로그인도 켜면 '["OKTA","TEMP"]'
  - target:
      kind: Ingress
      name: aibms-frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: aibms.example.invalid   # TODO 도메인 발급 대기 (aibms-backend · aibms-frontend 가 같은 값)
