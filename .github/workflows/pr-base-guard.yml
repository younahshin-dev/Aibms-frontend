# PR 대상(base) 브랜치 검사: main 으로 오는 PR 은 develop · release/* · hotfix/* 에서만 받는다 (BRANCHING.md).
# feature/* · chore/* 등이 실수로 main 을 향하면 실패한다 → "base 를 develop 으로 바꾸세요" 안내.
# (2026-11-03 PR #13 이 저장소 기본 브랜치 main 때문에 develop 대신 main 으로 머지된 일의 재발 방지)
#
# 머지 버튼까지 막으려면: Settings → Branches(또는 Rules → Rulesets) → main 규칙
#   → Require status checks to pass → 검사 이름 "pr-base-guard / main 으로 오는 PR 출발 브랜치 검사" 추가
#   (검사 이름은 이 워크플로가 한 번 실행된 뒤 목록에 나타난다)
name: pr-base-guard

on:
  pull_request:
    # edited: PR 화면에서 base 브랜치를 바꾼 경우도 다시 검사
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions: {}

jobs:
  check:
    name: main 으로 오는 PR 출발 브랜치 검사
    runs-on: ubuntu-latest
    steps:
      - name: 출발(head) 브랜치 확인
        env:
          # 브랜치 이름은 사용자가 정하는 값이라 run 안에 직접 넣지 않고 환경변수로 넘긴다
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR: ${HEAD_REF} → ${BASE_REF}"
          case "$HEAD_REF" in
            develop|release/*|hotfix/*)
              echo "허용: ${HEAD_REF} 는 main 으로 PR 할 수 있습니다."
              ;;
            *)
              echo "::error title=PR 대상 브랜치 오류::'${HEAD_REF}' 는 main 이 아니라 develop 으로 PR 해야 합니다. PR 화면에서 base 를 develop 으로 바꾸세요 (BRANCHING.md: main 은 develop·release/*·hotfix/* 만 받음)."
              exit 1
              ;;
          esac
