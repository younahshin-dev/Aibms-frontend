# PR 변경 요약: PR 을 열거나 커밋을 추가하면 AI(Claude)가 변경 내용을 읽고 확인하기 쉬운 요약 코멘트를 남긴다.
# 리뷰·승인을 대신하지 않는다. 빌드·테스트 통과 여부는 backend/frontend 워크플로가 판단한다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY 등록 (없으면 요약 단계는 건너뜀)
# 주의: PR 의 코드와 diff 가 외부 AI API 로 전송된다. 회사 저장소에 적용하려면 보안 승인이 필요하다.
# 참고: https://github.com/anthropics/claude-code-action (docs/solutions.md "Automatic PR Code Review")
name: pr-summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, "release/**", main]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: API 키 확인
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ANTHROPIC_API_KEY 없음 — 요약 생략"; fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR 브랜치가 현재 작업 디렉터리에 체크아웃되어 있다. `gh pr view`, `gh pr diff` 로 변경 내용을 읽어라.

            사람이 이 PR 의 변경 내용을 빠르게 확인할 수 있도록 한국어 요약 코멘트를 하나 작성한다.
            코드를 고치거나 승인·거절 의견을 내지 않는다. diff 에서 확인한 내용만 쓰고, 확실하지 않은 것은 "확인 필요"라고 쓴다.

            형식 (마크다운):
            ## 🔎 변경 요약
            - 이 PR 이 하는 일 1~3줄
            ## 변경 파일
            | 모듈/경로 | 변경 | 내용 |  (추가/수정/삭제, 파일별 한 줄)
            ## 영향 범위
            - API (URL·요청·응답 형식 변경, 하위 호환되지 않는 변경 여부)
            - DB (Flyway 마이그레이션·시드)
            - 설정·보안 (application*.yml, SecurityConfig, 권한)
            - 해당 없으면 "없음"
            ## 리뷰 때 볼 곳
            - 꼭 확인해야 할 부분을 `파일:라인` 과 함께 최대 5개
            ## 테스트
            - 변경에 맞춰 추가·수정된 테스트, 테스트가 없는 변경

            코멘트 게시: 먼저 `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file <파일>` 로 이전 요약을 갱신하고,
            실패하면(이전 코멘트 없음) `gh pr comment ${{ github.event.pull_request.number }} --body-file <파일>` 로 새로 작성한다.
            GitHub 코멘트로만 게시하고, 메시지로 결과를 출력하지 않는다.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Write,Glob,Grep"
