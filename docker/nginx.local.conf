# 로컬 docker compose 전용. 배포 환경에서는 Ingress 가 /api·/auth 를 백엔드로 보내지만,
# 로컬 compose 에는 Ingress 가 없으므로 nginx 가 대신 백엔드 컨테이너로 넘긴다.
# 접속 로그에 백엔드 응답 헤더 X-Request-Id(=traceId) 를 함께 찍는다.
log_format trace '$remote_addr [$time_local] "$request" $status ${request_time}s traceId=$upstream_http_x_request_id';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /dev/stdout trace;

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api|auth|\.well-known|swagger-ui|v3)/ {
        proxy_pass http://backend:8080;
        # 포트까지 넘겨야 백엔드가 브라우저 Origin(http://localhost:15173)을 같은 출처로 본다.
        # 백엔드는 forward-headers-strategy=framework 라 X-Forwarded-Proto 가 오면 포트를 기본값으로 되돌리므로
        # X-Forwarded-Host 에 host:port 를 함께 준다 (빠지면 CORS 403)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
